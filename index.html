<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF → Тест</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --border: #252b3b;
    --accent: #00e5ff;
    --accent-dim: rgba(0,229,255,0.12);
    --text: #e8eaf0;
    --muted: #6b7280;
    --correct: #22c55e;
    --wrong: #ef4444;
    --r: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #upload-screen { display: flex; flex-direction: column; align-items: center; gap: 28px; max-width: 480px; width: 100%; text-align: center; }
  .logo { font-size: 13px; font-weight: 500; letter-spacing: 0.08em; color: var(--accent); text-transform: uppercase; }
  h1 { font-size: clamp(26px, 5vw, 36px); font-weight: 600; line-height: 1.2; }
  h1 span { color: var(--accent); }
  .subtitle { font-size: 15px; color: var(--muted); line-height: 1.6; max-width: 360px; margin-top: 10px; }
  .drop-zone {
    width: 100%; border: 2px dashed var(--border); border-radius: var(--r);
    padding: 48px 24px; cursor: pointer; transition: border-color 0.2s, background 0.2s; position: relative;
  }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-dim); }
  .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .drop-icon { font-size: 36px; margin-bottom: 12px; }
  .drop-label { font-size: 14px; color: var(--muted); pointer-events: none; }
  .drop-label strong { color: var(--text); }
  .field-row { display: flex; align-items: center; gap: 12px; }
  .field-row label { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .field-row input {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; color: var(--text); font-family: inherit; font-size: 14px; width: 72px;
    transition: border-color 0.2s;
  }
  .field-row input:focus { outline: none; border-color: var(--accent); }
  .btn {
    background: var(--accent); color: #0f1117; border: none; border-radius: var(--r);
    padding: 13px 28px; font-family: inherit; font-size: 15px; font-weight: 600;
    cursor: pointer; width: 100%; transition: opacity 0.2s;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn:not(:disabled):hover { opacity: 0.85; }
  .error-box {
    background: rgba(239,68,68,0.1); border: 1px solid var(--wrong); border-radius: var(--r);
    padding: 14px 18px; font-size: 14px; color: #fca5a5; display: none; text-align: left; width: 100%;
  }

  /* LOADING */
  #loading-screen { display: none; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
  .spinner { width: 44px; height: 44px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-msg { font-size: 15px; color: var(--muted); }

  /* QUIZ */
  #quiz-screen { display: none; flex-direction: column; gap: 24px; max-width: 620px; width: 100%; }
  .quiz-header { display: flex; justify-content: space-between; align-items: center; }
  .quiz-counter, .quiz-score { font-size: 13px; color: var(--muted); font-weight: 500; }
  .progress-bar { width: 100%; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }
  .question-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 28px; }
  .question-text { font-size: 17px; font-weight: 500; line-height: 1.55; margin-bottom: 24px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; font-family: inherit; font-size: 15px; color: var(--text);
    cursor: pointer; text-align: left; transition: border-color 0.15s, background 0.15s; line-height: 1.4;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-dim); }
  .option.correct { border-color: var(--correct); background: rgba(34,197,94,0.1); color: var(--correct); }
  .option.wrong { border-color: var(--wrong); background: rgba(239,68,68,0.1); color: var(--wrong); }
  .option:disabled { cursor: default; }
  .explanation {
    margin-top: 16px; padding: 12px 14px; background: rgba(0,229,255,0.07);
    border-left: 3px solid var(--accent); border-radius: 4px;
    font-size: 13px; color: var(--muted); line-height: 1.6; display: none;
  }
  .quiz-nav { display: flex; justify-content: flex-end; }
  .btn-next {
    background: transparent; border: 1px solid var(--accent); color: var(--accent);
    border-radius: 8px; padding: 10px 24px; font-family: inherit; font-size: 14px;
    font-weight: 500; cursor: pointer; transition: background 0.15s; display: none;
  }
  .btn-next:hover { background: var(--accent-dim); }

  /* RESULTS */
  #result-screen { display: none; flex-direction: column; align-items: center; gap: 28px; max-width: 480px; width: 100%; text-align: center; }
  .result-emoji { font-size: 52px; }
  .result-title { font-size: 26px; font-weight: 600; }
  .result-score { font-size: 15px; color: var(--muted); }
  .result-score strong { color: var(--accent); font-size: 48px; display: block; font-weight: 600; line-height: 1.1; margin-bottom: 4px; }
  .btn-secondary {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    border-radius: var(--r); padding: 11px 24px; font-family: inherit; font-size: 14px;
    cursor: pointer; transition: border-color 0.15s, color 0.15s; width: 100%;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 480px) { .question-text { font-size: 15px; } .option { font-size: 14px; } }
</style>
</head>
<body>

<div id="upload-screen">
  <div class="logo">PDF → Тест</div>
  <div>
    <h1>Загрузи PDF —<br>получи <span>тест</span></h1>
    <p class="subtitle">Готовые вопросы из документа превратятся в интерактивный тест. Если теста нет — ИИ составит его по материалу PDF</p>
  </div>
  <div class="drop-zone" id="drop-zone">
    <input type="file" id="file-input" accept=".pdf">
    <div class="drop-icon">📄</div>
    <div class="drop-label"><strong>Выбери PDF</strong> или перетащи сюда</div>
  </div>
  <div class="error-box" id="error-box"></div>
  <button class="btn" id="start-btn" disabled>Создать тест</button>
</div>

<div id="loading-screen">
  <div class="spinner"></div>
  <div id="loading-msg">Читаю PDF…</div>
</div>

<div id="quiz-screen">
  <div class="quiz-header">
    <span class="quiz-counter" id="q-counter"></span>
    <span class="quiz-score" id="q-score"></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="question-card">
    <div class="question-text" id="question-text"></div>
    <div class="options" id="options"></div>
    <div class="explanation" id="explanation"></div>
  </div>
  <div class="quiz-nav"><button class="btn-next" id="btn-next">Следующий →</button></div>
</div>

<div id="result-screen">
  <div class="result-emoji" id="result-emoji"></div>
  <div class="result-title" id="result-title"></div>
  <div class="result-score">
    <strong id="result-pct"></strong>
    <span id="result-detail"></span>
  </div>
  <button class="btn-secondary" onclick="restart()">Пройти снова</button>
  <button class="btn-secondary" onclick="backToUpload()">Загрузить другой PDF</button>
</div>

<script>
// Вставь сюда URL опубликованного Cloudflare Worker (инструкция в README).
const WORKER_URL = 'https://black-cell-22e4.stup6d.workers.dev';

const $ = id => document.getElementById(id);
let questions = [], current = 0, score = 0, answered = false, selectedFile = null;

// ── PDF.js — load from CDN dynamically ──
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

async function getPdfJs() {
  if (!window.pdfjsLib) {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  }
  if (!window.pdfjsLib) throw new Error('Не удалось загрузить PDF.js. Проверь подключение к интернету и обнови страницу.');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return window.pdfjsLib;
}

// ── FILE INPUT ──
const dz = $('drop-zone');
$('file-input').addEventListener('change', e => { selectedFile = e.target.files[0]; updateDrop(); $('start-btn').disabled = false; });
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f && f.type === 'application/pdf') { selectedFile = f; updateDrop(); $('start-btn').disabled = false; }
});

function updateDrop() {
  dz.querySelector('.drop-label').innerHTML = `<strong>${selectedFile.name}</strong> (${(selectedFile.size/1024).toFixed(0)} KB)`;
  dz.querySelector('.drop-icon').textContent = '✅';
}

// ── EXTRACT TEXT ──
async function extractPdfText(file) {
  const pdfjs = await getPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjs.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(s => s.str).join(' ') + '\n';
  }
  return text.trim();
}

// ── EXTRACT OR GENERATE QUESTIONS ──
async function generateQuestions(pdfText) {
  if (!WORKER_URL || WORKER_URL.includes('ВСТАВЬ_URL')) {
    throw new Error('Сначала добавь URL Cloudflare Worker в переменную WORKER_URL в index.html. Инструкция есть в README.');
  }

  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      // Берём начало и конец PDF, чтобы не потерять ключ ответов в конце документа.
      text: pdfText.length <= 28000
        ? pdfText
        : pdfText.slice(0, 18000) + '\\n\\n[...середина документа сокращена...]\\n\\n' + pdfText.slice(-10000)
    })
  });

  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Ошибка сервера: ${res.status}`);

  const questions = data.questions;
  if (!Array.isArray(questions) || questions.length === 0) {
    throw new Error('В документе не удалось найти или составить вопросы. Попробуй PDF с выделяемым текстом.');
  }

  questions.forEach((q, i) => {
    if (!q || typeof q.question !== 'string' || !Array.isArray(q.options) ||
        q.options.length !== 4 || !Number.isInteger(q.correct) ||
        q.correct < 0 || q.correct > 3) {
      throw new Error(`Вопрос №${i + 1} пришёл в неправильном формате. Попробуй ещё раз.`);
    }
    if (typeof q.explanation !== 'string') q.explanation = '';
  });
  return questions;
}

// ── MAIN ──
$('start-btn').addEventListener('click', async () => {
  if (!selectedFile) { showError('Сначала выбери PDF-файл.'); return; }
  hideError();
  show('loading-screen'); hide('upload-screen');

  try {
    setMsg('Извлекаю текст из PDF…');
    const text = await extractPdfText(selectedFile);
    if (!text || text.length < 50) throw new Error('PDF не содержит читаемого текста (возможно, это скан-изображение).');

    setMsg('Проверяю, есть ли в PDF готовые вопросы…');
    questions = await generateQuestions(text);
    setMsg(`Подготовлено вопросов: ${questions.length}`);
    if (!Array.isArray(questions) || !questions.length) throw new Error('Не удалось сгенерировать вопросы.');

    startQuiz();
  } catch (err) {
    hide('loading-screen'); show('upload-screen');
    const message = err && err.name === 'TypeError'
      ? 'Не удалось связаться с сервером. Проверь URL Worker, настройки CORS и интернет.'
      : (err.message || 'Неизвестная ошибка. Попробуй ещё раз.');
    showError(message);
  }
});

function startQuiz() {
  current = 0; score = 0; answered = false;
  hide('loading-screen'); show('quiz-screen');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current], total = questions.length;
  $('q-counter').textContent = `Вопрос ${current + 1} из ${total}`;
  $('q-score').textContent = `Счёт: ${score}`;
  $('progress-fill').style.width = `${(current / total) * 100}%`;
  $('question-text').textContent = q.question;
  const opts = $('options');
  opts.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option'; btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(i));
    opts.appendChild(btn);
  });
  $('explanation').style.display = 'none';
  $('btn-next').style.display = 'none';
  answered = false;
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const opts = $('options').querySelectorAll('.option');
  opts.forEach(o => o.disabled = true);
  opts[q.correct].classList.add('correct');
  if (idx !== q.correct) opts[idx].classList.add('wrong');
  else score++;
  $('q-score').textContent = `Счёт: ${score}`;
  if (q.explanation) { $('explanation').textContent = q.explanation; $('explanation').style.display = 'block'; }
  $('btn-next').textContent = current === questions.length - 1 ? 'Завершить тест' : 'Следующий →';
  $('btn-next').style.display = 'inline-block';
}

$('btn-next').addEventListener('click', () => { current++; current >= questions.length ? showResults() : renderQuestion(); });

function showResults() {
  hide('quiz-screen'); show('result-screen');
  const pct = Math.round((score / questions.length) * 100);
  $('result-pct').textContent = `${pct}%`;
  $('result-detail').textContent = `Правильных: ${score} из ${questions.length}`;
  $('result-emoji').textContent = pct >= 80 ? '🏆' : pct >= 50 ? '👍' : '📚';
  $('result-title').textContent = pct >= 80 ? 'Отлично!' : pct >= 50 ? 'Неплохо!' : 'Стоит повторить';
}

function restart() { startQuiz(); }
function backToUpload() {
  hide('result-screen'); show('upload-screen');
  selectedFile = null;
  dz.querySelector('.drop-label').innerHTML = '<strong>Выбери PDF</strong> или перетащи сюда';
  dz.querySelector('.drop-icon').textContent = '📄';
  $('file-input').value = '';
  $('start-btn').disabled = true;
}

function show(id) { $(id).style.display = 'flex'; }
function hide(id) { $(id).style.display = 'none'; }
function setMsg(m) { $('loading-msg').textContent = m; }
function showError(m) { $('error-box').textContent = m; $('error-box').style.display = 'block'; }
function hideError() { $('error-box').style.display = 'none'; }
</script>
</body>
</html>
